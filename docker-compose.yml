# ============================================
# FLEX-VRP — Docker Compose (Development)
# ============================================
# Khởi chạy: docker compose up -d
# Tắt:       docker compose down
# Reset DB:  docker compose down -v
# ============================================

services:
  # ── Laravel Application ──────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: flexvrp-app
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["bash", "/var/www/html/docker/entrypoint.sh"]
    command: php-fpm
    volumes:
      - .:/var/www/html
    networks:
      - flexvrp-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=flexvrp
      - DB_USERNAME=flexvrp
      - DB_PASSWORD=flexvrp_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis

  # ── Nginx Web Server ────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: flexvrp-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - flexvrp-network
    depends_on:
      - app

  # ── MySQL Database ──────────────────────────
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    container_name: flexvrp-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: flexvrp
      MYSQL_USER: flexvrp
      MYSQL_PASSWORD: flexvrp_secret
    volumes:
      - flexvrp-mysql-data:/var/lib/mysql
    networks:
      - flexvrp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis Cache & Queue ─────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: flexvrp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - flexvrp-redis-data:/data
    networks:
      - flexvrp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Vite Dev Server (Frontend HMR) ──────────
  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: flexvrp-vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    networks:
      - flexvrp-network
    depends_on:
      - app

  # ── phpMyAdmin (Database GUI) ───────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: flexvrp-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: flexvrp
      PMA_PASSWORD: flexvrp_secret
      UPLOAD_LIMIT: 64M
    networks:
      - flexvrp-network
    depends_on:
      mysql:
        condition: service_healthy

# ── Volumes ─────────────────────────────────
volumes:
  flexvrp-mysql-data:
    driver: local
  flexvrp-redis-data:
    driver: local

# ── Networks ────────────────────────────────
networks:
  flexvrp-network:
    driver: bridge
